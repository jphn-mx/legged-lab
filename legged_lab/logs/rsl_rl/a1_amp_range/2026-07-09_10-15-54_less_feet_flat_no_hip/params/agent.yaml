seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 50000
empirical_normalization: true
obs_groups:
  policy:
  - policy
  critic:
  - critic
  discriminator:
  - disc
  discriminator_demonstration:
  - disc_demo
clip_actions: null
check_for_nan: true
save_interval: 100
experiment_name: a1_amp_range
run_name: less_feet_flat_no_hip
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: AMPRunner
actor: {}
critic: {}
algorithm:
  class_name: PPOAMP
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: true
    use_mirror_loss: true
    data_augmentation_func: legged_lab.tasks.locomotion.amp.mdp.symmetry.a1:compute_symmetric_states
    mirror_loss_coeff: 0.1
  amp_cfg:
    disc_obs_buffer_size: 100
    grad_penalty_scale: 10.0
    disc_trunk_weight_decay: 0.0001
    disc_linear_weight_decay: 0.01
    disc_learning_rate: 0.0003
    disc_max_grad_norm: 1.0
    amp_discriminator:
      hidden_dims:
      - 1024
      - 512
      activation: elu
      style_reward_scale: 4.0
      task_style_lerp: 0.6
      use_spectral_norm: false
    loss_type: LSGAN
    reward_type: LSGAN
policy:
  class_name: ActorCritic
  init_noise_std: 1.0
  noise_std_type: scalar
  state_dependent_std: false
  actor_obs_normalization: {}
  critic_obs_normalization: {}
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
